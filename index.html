<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kasatria — People Table</title>
<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<style>
    html, body {
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: Helvetica, Arial, sans-serif;
    }

    a { color: #8ff; }

    :root { --header-height: 0px; }

    /* --- Header bar: #info, #legend and #filter-bar combined into a
       single solid, full-width bar fixed to the top of the viewport.
       #container is offset below it (see #container rule) so the 3D
       scene can never render behind it, regardless of camera angle. --- */
    #header-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: #050505;
        border-bottom: 1px solid rgba(127,255,255,0.15);
        z-index: 3;
        display: flex;
        flex-direction: column;
    }

    #info {
        padding: 10px 10px 6px;
        text-align: center;
        color: rgba(255,255,255,0.7);
        font-size: 13px;
        pointer-events: none;
    }

    #container {
        position: absolute;
        top: var(--header-height);
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
    }

    #menu {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        z-index: 1;
    }

    button {
        color: rgba(127,255,255,0.75);
        background: transparent;
        outline: 1px solid rgba(127,255,255,0.75);
        border: 0;
        padding: 6px 12px;
        margin: 0 4px;
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 1px;
    }
    button:hover { background-color: rgba(0,255,255,0.15); }
    button:active { color: #000; background-color: rgba(0,255,255,0.75); }

    #legend {
        width: 100%;
        text-align: center;
        font-size: 11px;
        color: rgba(255,255,255,0.6);
        pointer-events: none;
        padding: 0 10px 8px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    #legend span { padding: 0 10px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

    #filter-bar {
        padding: 0 10px 12px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
    }
    .filter-control {
        padding: 6px 10px;
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(127,255,255,0.5);
        border-radius: 4px;
        color: #8ff;
        font-size: 12px;
        font-family: Helvetica, Arial, sans-serif;
        outline: none;
        color-scheme: dark;
    }
    .filter-control::placeholder { color: rgba(127,255,255,0.4); }
    .filter-control:focus { border-color: rgba(127,255,255,0.9); box-shadow: 0 0 8px rgba(0,255,255,0.4); }
    input.filter-control { width: 150px; }
    select.filter-control { cursor: pointer; }
    #clear-filters { font-size: 11px; }

    .element {
        width: 130px;
        height: 174px;
        box-shadow: 0 0 12px rgba(0,255,255,0.35);
        border-width: 2px;
        border-style: solid;
        font-family: Helvetica, sans-serif;
        text-align: center;
        line-height: normal;
        cursor: default;
        border-radius: 4px;
        overflow: hidden;
        transition: opacity 0.2s ease;
    }
    .element:hover { box-shadow: 0 0 16px rgba(0,255,255,0.7); }
    .element.match {
        border-color: #8ff;
        box-shadow: 0 0 20px rgba(0,255,255,0.9);
    }

    .element .photo {
        width: 100%;
        height: 84px;
        overflow: hidden;
        background: #111;
    }
    .element .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .element .name {
        margin-top: 6px;
        font-size: 13px;
        font-weight: bold;
        color: rgba(255,255,255,0.9);
        padding: 0 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .element .details {
        margin-top: 4px;
        font-size: 10px;
        color: rgba(255,255,255,0.7);
        line-height: 1.4;
    }
    .element .worth {
        position: absolute;
        top: 4px;
        right: 6px;
        font-size: 9px;
        color: rgba(255,255,255,0.85);
        background: rgba(0,0,0,0.35);
        padding: 1px 4px;
        border-radius: 3px;
    }

    /* --- Sign-in gate --- */
    #login-screen {
        position: fixed;
        inset: 0;
        background: #050505;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
    }
    #login-card {
        width: 320px;
        padding: 32px 28px;
        border: 1px solid rgba(127,255,255,0.25);
        border-radius: 8px;
        background: rgba(255,255,255,0.02);
        text-align: center;
    }
    #login-card h1 {
        font-size: 17px;
        font-weight: 500;
        color: rgba(255,255,255,0.92);
        margin: 0 0 6px;
    }
    #login-card p {
        font-size: 13px;
        color: rgba(255,255,255,0.55);
        margin: 0 0 22px;
    }
    #google-btn-slot { display: flex; justify-content: center; }
    #login-status {
        margin-top: 14px;
        font-size: 12px;
        color: rgba(255,140,140,0.85);
        min-height: 16px;
    }

    /* --- Person detail panel --- */
    #detail-panel {
        position: absolute;
        left: 20px;
        bottom: 20px;
        width: 240px;
        padding: 16px 18px;
        border: 1px solid rgba(127,255,255,0.3);
        border-radius: 8px;
        background: rgba(5,5,5,0.85);
        color: rgba(255,255,255,0.85);
        font-size: 12px;
        line-height: 1.6;
        z-index: 2;
        display: none;
        box-shadow: 0 0 16px rgba(0,255,255,0.25);
    }
    #detail-panel.visible { display: block; }
    #detail-panel h2 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 600;
        color: rgba(255,255,255,0.95);
        padding-right: 20px;
        word-break: break-word;
    }
    #detail-panel .row { margin-bottom: 4px; color: rgba(255,255,255,0.7); }
    #detail-panel .worth { color: rgba(127,255,255,0.9); font-weight: 600; }
    #detail-panel-close {
        position: absolute;
        top: 8px;
        right: 10px;
        background: transparent;
        border: 0;
        outline: 0;
        color: rgba(255,255,255,0.5);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
        margin: 0;
    }
    #detail-panel-close:hover { color: #8ff; }

    #loading-screen {
        position: fixed;
        inset: 0;
        background: #050505;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9;
        color: rgba(127,255,255,0.75);
        font-size: 13px;
        letter-spacing: 1px;
    }
</style>
</head>
<body>

    <div id="login-screen">
        <div id="login-card">
            <h1>Kasatria — People Table</h1>
            <p>Sign in with Google to view the visualization.</p>
            <div id="google-btn-slot"></div>
            <div id="login-status"></div>
        </div>
    </div>

    <div id="loading-screen">LOADING DATA…</div>

    <div id="header-bar">
        <div id="info">Kasatria — People Table. Drag to rotate, scroll to zoom.</div>
        <div id="legend">
            <span><i class="dot" style="background:#e24b4a"></i>&lt; $100K</span>
            <span><i class="dot" style="background:#ef9f27"></i>$100K – $200K</span>
            <span><i class="dot" style="background:#63c46a"></i>&gt; $200K</span>
        </div>
        <div id="filter-bar">
            <input id="search-name" class="filter-control" type="text" placeholder="Search name..." autocomplete="off">
            <select id="filter-country" class="filter-control">
                <option value="">All countries</option>
            </select>
            <select id="filter-interest" class="filter-control">
                <option value="">All interests</option>
            </select>
            <select id="filter-worth" class="filter-control">
                <option value="">All net worth</option>
                <option value="red">Red (&lt; $100K)</option>
                <option value="orange">Orange ($100K-$200K)</option>
                <option value="green">Green (&gt; $200K)</option>
            </select>
            <button id="clear-filters" type="button">CLEAR</button>
        </div>
    </div>
    <div id="container"></div>
    <div id="detail-panel">
        <button id="detail-panel-close" aria-label="Close">&times;</button>
        <h2 id="detail-name"></h2>
        <div class="row" id="detail-age-country"></div>
        <div class="row" id="detail-interest"></div>
        <div class="row worth" id="detail-worth"></div>
    </div>
    <div id="menu">
        <button id="table">TABLE</button>
        <button id="sphere">SPHERE</button>
        <button id="helix">HELIX</button>
        <button id="grid">GRID</button>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="app.js"></script>
</body>
</html>
